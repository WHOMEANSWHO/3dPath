name: Release Windows EXE

on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and build school
        working-directory: 3dpath
        run: |
          npm ci
          npm run build
          python -m pip install -r desktop-requirements.txt
          python build.py --skip-npm
      - name: Upload 3dPath.exe
        uses: softprops/action-gh-release@v2
        with:
          files: 3dpath/release/3dPath.exe
          generate_release_notes: true
